[project]
name = "cliyard"
version = "0.13.0"
description = "YAML-driven CLI framework — turn any REST API into CLI commands"
authors = [
    {name = "keta", email = "dev@ketaops.cc"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["cli", "yaml", "rest-api", "codegen", "click"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.1.0",
    "pyyaml~=6.0",
    "requests~=2.31.0",
    "jinja2~=3.1",
    "rich>=13.7.0",
    "jsonpath-ng~=1.7.0",
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "sse-starlette>=3.4.0",
    "python-multipart>=0.0.30",
    "mcp~=2.0.0",
]

# mcp 原先作为 optional-dependency 引入（cliyard[mcp]），但
# create_cli() 无条件导入 build_mcp_command -> server/mcp/*，
# 可选依赖仍会导致下游 CLI 启动时 ModuleNotFoundError，
# 故提升为 required dependency。
[project.optional-dependencies]
# Kept for backward compatibility — `pip install cliyard[mcp]` still works
mcp = ["mcp~=2.0.0"]

[project.urls]
Homepage = "https://github.com/guolong123/cliyard"
Repository = "https://github.com/guolong123/cliyard.git"

[project.scripts]
cliyard = "cliyard.cli.__main__:main"

# 前端产物（src/cliyard/server/webui/dist/）随 wheel 分发，
# 使 `cliyard serve` 在 PyPI 安装场景下无需本地前端构建。
# 构建产物由 scripts/build-webui.sh 在发布前生成并提交进仓库。
[tool.setuptools.package-data]
cliyard = ["server/webui/**/*"]

[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"
