[project]
name = "cliyard"
version = "0.9.1"
description = "YAML-driven CLI framework 鈥?turn any REST API into CLI commands"
authors = [
    {name = "keta", email = "dev@ketaops.cc"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["cli", "yaml", "rest-api", "codegen", "click"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.1.0",
    "pyyaml~=6.0",
    "requests~=2.31.0",
    "jinja2~=3.1",
    "rich>=13.7.0",
    "jsonpath-ng~=1.7.0",
    "mcp>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/guolong123/cliyard"
Repository = "https://github.com/guolong123/cliyard.git"

[project.scripts]
cliyard = "cliyard.cli.__main__:main"

[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"
