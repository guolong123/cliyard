[project]
name = "cliyard"
version = "0.12.1"
description = "YAML-driven CLI framework — turn any REST API into CLI commands"
authors = [
    {name = "keta", email = "dev@ketaops.cc"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["cli", "yaml", "rest-api", "codegen", "click"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.1.0",
    "pyyaml~=6.0",
    "requests~=2.31.0",
    "jinja2~=3.1",
    "rich>=13.7.0",
    "jsonpath-ng~=1.7.0",
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "sse-starlette>=3.4.0",
    "python-multipart>=0.0.30",
]

# 可选依赖：MCP Server 启动能力（cliyard mcp）。官方 mcp Python SDK 仅作为
# optional extra 引入，不污染核心依赖（cliyard serve / CLI 无需安装）。
# 版本锁定 mcp~=2.0.0：2.x 引入低层 Server + Streamable HTTP 的统一 API，
# 代码按 2.0.x 接口实现（低层 Server.on_list_tools/on_call_tool +
# streamable_http_app / stdio_server）。
[project.optional-dependencies]
mcp = ["mcp~=2.0.0"]

[project.urls]
Homepage = "https://github.com/guolong123/cliyard"
Repository = "https://github.com/guolong123/cliyard.git"

[project.scripts]
cliyard = "cliyard.cli.__main__:main"

# 前端产物（src/cliyard/server/webui/dist/）随 wheel 分发，
# 使 `cliyard serve` 在 PyPI 安装场景下无需本地前端构建。
# 构建产物由 scripts/build-webui.sh 在发布前生成并提交进仓库。
[tool.setuptools.package-data]
cliyard = ["server/webui/**/*"]

[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"
